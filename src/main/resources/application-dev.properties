spring.application.name=micro-market-dev

# Liquibase context for seed data
spring.liquibase.contexts=dev

# CORS
cors.allowed-origins=http://localhost:5173

# OpenAPI Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Auth
auth.refresh-cookie.secure=false

# Mail — off by default
mail.enabled=${MAIL_ENABLED:false}
mail.resend.api-key=${RESEND_API_KEY}
mail.from.address=${MAIL_FROM_ADDRESS}
mail.from.name=${MAIL_FROM_NAME:MicroMarket Dev}
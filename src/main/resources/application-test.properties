# H2 Database Configuration
# Using a fresh in-memory database per Spring test ApplicationContext to avoid Liquibase collisions.
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
# spring.jpa.defer-datasource-initialization=true

# Liquibase — run all changesets (including dev seeds) so tests have baseline admin/user accounts.
spring.liquibase.enabled=true

# Auth
auth.refresh-cookie.secure=false

# Disable scheduled refresh token cleanup in tests
auth.refresh-token.cleanup-cron=-

# Stripe test values — real API never called
stripe.secret-key=sk_test_dummy
stripe.webhook-secret=whsec_test_dummy
stripe.success-url=http://localhost:5173/checkout/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:5173/checkout/cancel
stripe.session-expiration-minutes=30

# Disable scheduled stripe event cleanup in tests
stripe.event.cleanup-cron=-

# Mail test values — real Resend HTTP client never fires
mail.enabled=false
mail.resend.api-key=re_test_dummy
mail.from.address=no-reply@micromarket.test
mail.from.name=MicroMarket Test

# Allow test-only beans to override production definitions
spring.main.allow-bean-definition-overriding=true

spring.application.name=micro-market
server.servlet.context-path=/api/v1
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Pagination Configuration
spring.data.web.pageable.serialization-mode=via-dto

# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# h2
spring.h2.console.enabled=false

# Liquibase Configuration
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# JWT Token Configuration
jwt.access-token.expiration=PT15M
jwt.refresh-token.expiration=P7D

# Refresh Cookie Configuration
auth.refresh-cookie.name=refresh_token
auth.refresh-cookie.path=/api/v1/auth
auth.refresh-cookie.same-site=Lax
auth.refresh-cookie.secure=true

# Refresh Token Cleanup
auth.refresh-token.cleanup-cron=0 0 * * * *
auth.refresh-token.cleanup-grace=P7D

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.success-url=${STRIPE_SUCCESS_URL}
stripe.cancel-url=${STRIPE_CANCEL_URL}
stripe.session-expiration-minutes=${STRIPE_SESSION_EXPIRATION_MINUTES:30}

# Stripe Event Cleanup
stripe.event.cleanup-cron=0 0 * * * *
stripe.event.retention=P7D

# Mail (Resend)
mail.enabled=${MAIL_ENABLED:true}
mail.resend.api-key=${RESEND_API_KEY}
mail.from.address=${MAIL_FROM_ADDRESS}
mail.from.name=${MAIL_FROM_NAME:MicroMarket}

# No MVC views — emails use a dedicated engine
spring.thymeleaf.check-template-location=false

# Logging
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# OpenAPI Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

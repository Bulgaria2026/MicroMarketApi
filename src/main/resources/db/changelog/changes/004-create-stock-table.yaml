databaseChangeLog:
  - changeSet:
      id: 4
      author: BambusTM
      changes:
        - createTable:
            tableName: stock
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: amount
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: true
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createTable:
            tableName: stock_product
            columns:
              - column:
                  name: stock_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: stock_product
            columnNames: stock_id, product_id
            constraintName: pk_stock_product

        - addForeignKeyConstraint:
            baseTableName: stock_product
            baseColumnNames: stock_id
            referencedTableName: stock
            referencedColumnNames: id
            constraintName: fk_stock_product_stock

        - addForeignKeyConstraint:
            baseTableName: stock_product
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_stock_product_product
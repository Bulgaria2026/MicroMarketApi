databaseChangeLog:
  - changeSet:
      id: 3
      author: BambusTM
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: varchar(1000)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: numeric
                  constraints:
                    nullable: false

              - column:
                  type: integer
                  name: discount
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: true
                  defaultValueComputed: CURRENT_TIMESTAMP

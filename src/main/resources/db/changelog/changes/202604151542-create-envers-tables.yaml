databaseChangeLog:
  - changeSet:
      id: 202604151542-1
      author: Codex
      changes:
        - createSequence:
            sequenceName: revinfo_seq
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: revinfo
            columns:
              - column:
                  name: rev
                  type: integer
                  defaultValueSequenceNext: revinfo_seq
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: revtstmp
                  type: bigint

        - createTable:
            tableName: product_aud
            columns:
              - column:
                  name: rev
                  type: integer
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint

              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)

              - column:
                  name: description
                  type: varchar(1000)

              - column:
                  name: price
                  type: decimal(10,2)

              - column:
                  name: discount
                  type: integer

              - column:
                  name: enabled
                  type: boolean

              - column:
                  name: amount
                  type: bigint

              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_at
                  type: timestamp

        - addPrimaryKey:
            tableName: product_aud
            columnNames: rev, id
            constraintName: pk_product_aud

        - addForeignKeyConstraint:
            baseTableName: product_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_product_aud_revinfo

databaseChangeLog:
  - changeSet:
      id: 202604180950-1
      author: Lon60
      comment: Sequence backing the human-readable order_number (MM-000001, …). Starts at 3 because the dev seed pre-allocates 1 and 2.
      changes:
        - createSequence:
            sequenceName: order_number_seq
            startValue: 3
            incrementBy: 1

  - changeSet:
      id: 202604180950-2
      author: Lon60
      comment: Add order_number + email with placeholder defaults so seeded rows pass NOT NULL; backfilled below; defaults + unique constraint added right after.
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: order_number
                  type: varchar(32)
                  constraints:
                    nullable: false
                  defaultValue: PLACEHOLDER
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                  defaultValue: placeholder@invalid

  - changeSet:
      id: 202604180950-3
      author: Lon60
      comment: Backfill seeded orders. No-op in prod (no rows match); dev seeds get sensible values.
      changes:
        - update:
            tableName: orders
            columns:
              - column:
                  name: order_number
                  value: MM-000001
              - column:
                  name: email
                  value: admin@micromarket.dev
            where: id = '11111111-1111-1111-1111-111111111111'
        - update:
            tableName: orders
            columns:
              - column:
                  name: order_number
                  value: MM-000002
              - column:
                  name: email
                  value: user@micromarket.dev
            where: id = '22222222-2222-2222-2222-222222222222'

  - changeSet:
      id: 202604180950-4
      author: Lon60
      comment: Drop placeholder defaults and promote order_number to UNIQUE now that every row has a distinct backfilled value.
      changes:
        - dropDefaultValue:
            tableName: orders
            columnName: order_number
        - dropDefaultValue:
            tableName: orders
            columnName: email
        - addUniqueConstraint:
            tableName: orders
            columnNames: order_number
            constraintName: uk_order_order_number

  - changeSet:
      id: 202604180950-5
      author: Lon60
      changes:
        - addColumn:
            tableName: order_item
            columns:
              - column:
                  name: product_name
                  type: varchar(255)
                  constraints:
                    nullable: false
                  defaultValue: Unknown product
              - column:
                  name: original_unit_price
                  type: decimal(10,2)
                  constraints:
                    nullable: false
                  defaultValueNumeric: 0

  - changeSet:
      id: 202604180950-6
      author: Lon60
      changes:
        - update:
            tableName: order_item
            columns:
              - column:
                  name: product_name
                  value: Sparkling Water
              - column:
                  name: original_unit_price
                  valueNumeric: 29.99
            where: id = '33333333-3333-3333-3333-333333333333'
        - update:
            tableName: order_item
            columns:
              - column:
                  name: product_name
                  value: Coffee Beans
              - column:
                  name: original_unit_price
                  valueNumeric: 99.50
            where: id = '44444444-4444-4444-4444-444444444444'

  - changeSet:
      id: 202604180950-7
      author: Lon60
      changes:
        - dropDefaultValue:
            tableName: order_item
            columnName: product_name
        - dropDefaultValue:
            tableName: order_item
            columnName: original_unit_price

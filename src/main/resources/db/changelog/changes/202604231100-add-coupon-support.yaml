databaseChangeLog:
  - changeSet:
      id: 202604231100-1
      author: Codex
      changes:
        - createTable:
            tableName: coupon
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: code
                  type: varchar(500)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_coupon_code
              - column:
                  name: name
                  type: varchar(40)
              - column:
                  name: start_date
                  type: timestamp
              - column:
                  name: expiry_date
                  type: timestamp
              - column:
                  name: point_cost
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: amount_off
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: max_redemptions
                  type: int
              - column:
                  name: times_redeemed
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: stripe_coupon_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_coupon_stripe_coupon_id
              - column:
                  name: stripe_promotion_code_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_coupon_stripe_promotion_code_id
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp

        - addForeignKeyConstraint:
            baseTableName: coupon
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_coupon_user

  - changeSet:
      id: 202604231100-2
      author: Codex
      changes:
        - createTable:
            tableName: coupon_aud
            columns:
              - column:
                  name: rev
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
              - column:
                  name: code
                  type: varchar(500)
              - column:
                  name: name
                  type: varchar(40)
              - column:
                  name: start_date
                  type: timestamp
              - column:
                  name: expiry_date
                  type: timestamp
              - column:
                  name: point_cost
                  type: int
              - column:
                  name: amount_off
                  type: decimal(10,2)
              - column:
                  name: max_redemptions
                  type: int
              - column:
                  name: times_redeemed
                  type: int
              - column:
                  name: active
                  type: boolean
              - column:
                  name: stripe_coupon_id
                  type: varchar(255)
              - column:
                  name: stripe_promotion_code_id
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp

        - addPrimaryKey:
            tableName: coupon_aud
            columnNames: rev, id
            constraintName: pk_coupon_aud

        - addForeignKeyConstraint:
            baseTableName: coupon_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_coupon_aud_revinfo

  - changeSet:
      id: 202604231100-3
      author: Codex
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: coupon_id
                  type: uuid
              - column:
                  name: points_awarded
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: coupon_id
            referencedTableName: coupon
            referencedColumnNames: id
            constraintName: fk_order_coupon

  - changeSet:
      id: 202604231100-4
      author: Codex
      changes:
        - addColumn:
            tableName: orders_aud
            columns:
              - column:
                  name: coupon_id
                  type: uuid
              - column:
                  name: points_awarded
                  type: boolean

  - changeSet:
      id: 202604231100-5
      author: Codex
      changes:
        - addColumn:
            tableName: customer
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addColumn:
            tableName: profile
            columns:
              - column:
                  name: last_change_reason
                  type: varchar(255)

plugins {
    id "java"
    id "org.springframework.boot" version "4.0.5"
    id "io.spring.dependency-management" version "1.1.7"
    id "net.ltgt.errorprone" version "5.1.0"
}

group = "com.noser-bulgaria"
version = "0.0.1-SNAPSHOT"
description = "micro-market"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "GitHubPackagesMicroMarketMail"
        url = uri("https://maven.pkg.github.com/Bulgaria2026/MicroMarketMail")
        credentials {
            username = System.getenv("GITHUB_USERNAME") ?: (findProperty("gpr.user") as String ?: "")
            password = System.getenv("GITHUB_TOKEN")    ?: (findProperty("gpr.key")  as String ?: "")
        }
    }
}

ext {
    mapstructVersion = "1.6.3"
    lombokMapstructBindingVersion = "0.2.0"
    openapiWebmvcVersion = "3.0.2"
    googleErrorProneCoreVersion = "2.49.0"
    uberNullawayVersion = "0.13.3"
    stripeVersion = "32.0.0"
    emailTemplatesVersion = "0.2.0-SNAPSHOT"
    resendVersion = "v4.14.1"
    springRetryVersion = "2.0.12"
}

dependencies {
    // Core Spring Boot Starters
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.boot:spring-boot-starter-liquibase"
    implementation "org.springframework.data:spring-data-envers"

    // Databases & Dev Tools
    implementation "org.springframework.boot:spring-boot-h2console"
    runtimeOnly "com.h2database:h2"
    runtimeOnly "org.postgresql:postgresql"
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    // Documentation / API
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2"

    // Payments
    implementation "com.stripe:stripe-java:${stripeVersion}"

    // Email templates + rendering + transport
    implementation "com.noserbulgaria.micromarket:email-templates:${emailTemplatesVersion}"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.retry:spring-retry:${springRetryVersion}"
    implementation "com.resend:resend-java:${resendVersion}"

    // Mapping & Code Generation
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    annotationProcessor "org.hibernate.orm:hibernate-processor"

    // Testing
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa-test"
    testImplementation "org.springframework.boot:spring-boot-starter-liquibase-test"
    testImplementation "org.springframework.boot:spring-boot-starter-security-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testCompileOnly "org.projectlombok:lombok"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testAnnotationProcessor "org.projectlombok:lombok"
    testAnnotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // Error Prone Static Analysis
    errorprone "com.google.errorprone:error_prone_core:${googleErrorProneCoreVersion}"
    errorprone "com.uber.nullaway:nullaway:${uberNullawayVersion}"
}

import net.ltgt.gradle.errorprone.CheckSeverity

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true
        checks.put("NullAway", CheckSeverity.ERROR)
        option("NullAway:OnlyNullMarked", "true")
        option("NullAway:JSpecifyMode", "true")
        option("NullAway:TreatGeneratedAsUnannotated", "true")
    }
}

tasks.withType(JavaCompile).matching { it.name.toLowerCase().contains("test") }.configureEach {
    options.errorprone.enabled = false
}

tasks.named("test") {
    useJUnitPlatform()
}
